<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Idegro® Seeds | Grow Your Advantage</title>
  <meta
    name="description"
    content="Idegro® vegetable seeds. Seeds designed for tropical growers."
  >

  <style>
    :root {
      --green: #56AB2F;
      --green-2: #469326;
      --green-3: #36751E;
      --green-4: #255514;
      --light: #F4F8F1;
      --white: #ffffff;
      --text: #173116;
      --muted: #63705f;
      --footer: #074540;

      --container: 1180px;
      --radius: 18px;
      --shadow: 0 12px 35px rgba(37, 85, 20, 0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--white);
      color: var(--text);
      overflow-x: hidden;
      line-height: 1.6;
    }

    img {
      display: block;
      width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(var(--container), calc(100% - 32px));
      margin: 0 auto;
    }

    /* =========================
       NAVIGATION
    ========================= */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(37,85,20,0.08);
    }

    .nav-inner {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      width: 145px;
      flex-shrink: 0;
    }

    .logo img {
      width: 100%;
      height: auto;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 30px;
      list-style: none;
    }

    .nav-links a {
      font-size: 15px;
      font-weight: 600;
      color: var(--green-4);
      transition: color .25s ease;
    }

    .nav-links a:hover {
      color: var(--green);
    }

    .nav-cta {
      background: var(--green);
      color: white !important;
      padding: 11px 18px;
      border-radius: 999px;
    }

    .nav-cta:hover {
      background: var(--green-3);
    }

    .menu-btn {
      display: none;
      width: 44px;
      height: 44px;
      border: 0;
      background: var(--light);
      border-radius: 10px;
      cursor: pointer;
      color: var(--green-4);
      font-size: 22px;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 680px;
      padding-top: 76px;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
      background:
        linear-gradient(
          90deg,
          rgba(20, 50, 14, 0.78) 0%,
          rgba(20, 50, 14, 0.48) 45%,
          rgba(20, 50, 14, 0.12) 100%
        ),
        url("images/idegro-hero.jpg") center/cover no-repeat;
    }

    .hero-content {
      max-width: 720px;
      color: white;
      padding: 70px 0;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 2px;
      background: var(--green);
    }

    .hero h1 {
      font-size: clamp(48px, 7vw, 88px);
      line-height: .98;
      letter-spacing: -0.045em;
      margin-bottom: 24px;
      font-weight: 800;
    }

    .hero p {
      max-width: 600px;
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.6;
      color: rgba(255,255,255,.94);
      margin-bottom: 34px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
    }

    .btn {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 50px;
      padding: 13px 22px;
      border-radius: 999px;
      font-weight: 700;
      transition:
        transform .25s ease,
        background .25s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--green);
      color: white;
    }

    .btn-primary:hover {
      background: var(--green-3);
    }

    .btn-light {
      background: white;
      color: var(--green-4);
    }

    /* =========================
       INTRO
    ========================= */

    .intro {
      padding: 105px 0;
    }

    .intro-grid {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 80px;
      align-items: start;
    }

    .section-label {
      color: var(--green-2);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .09em;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .intro h2,
    .section-heading h2 {
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.05;
      letter-spacing: -.035em;
      color: var(--green-4);
    }

    .intro-text {
      color: var(--muted);
      font-size: 18px;
      max-width: 680px;
    }

    .intro-text p + p {
      margin-top: 18px;
    }

    /* =========================
       CROPS
    ========================= */

    .crops-section {
      background: var(--light);
      padding: 100px 0;
    }

    .section-heading {
      max-width: 700px;
      margin-bottom: 40px;
    }

    .section-heading p {
      color: var(--muted);
      font-size: 17px;
      margin-top: 17px;
    }

    .crop-scroll-wrap {
      position: relative;
    }

    .crop-grid {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 8px 3px 22px;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: var(--green) transparent;
      -webkit-overflow-scrolling: touch;
    }

    .crop-grid::-webkit-scrollbar {
      height: 7px;
    }

    .crop-grid::-webkit-scrollbar-thumb {
      background: var(--green);
      border-radius: 999px;
    }

    .crop-card {
      flex: 0 0 270px;
      scroll-snap-align: start;
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition:
        transform .3s ease,
        box-shadow .3s ease;
    }

    .crop-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 42px rgba(37,85,20,.15);
    }

    .crop-image {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #dfe9db;
    }

    .crop-image img {
      height: 100%;
      object-fit: cover;
      transition: transform .5s ease;
    }

    .crop-card:hover .crop-image img {
      transform: scale(1.05);
    }

    .crop-info {
      padding: 21px;
    }

    .crop-info h3 {
      font-size: 23px;
      color: var(--green-4);
      margin-bottom: 8px;
    }

    .crop-info span {
      color: var(--green-2);
      font-weight: 700;
      font-size: 14px;
    }

    .swipe-note {
      display: none;
      margin-top: 10px;
      color: var(--green-3);
      font-size: 13px;
      font-weight: 700;
      text-align: right;
    }

    /* =========================
       WHY IDEGRO
    ========================= */

    .why {
      padding: 110px 0;
    }

    .why-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      align-items: center;
    }

    .why-image {
      border-radius: 22px;
      overflow: hidden;
      background: var(--light);
      min-height: 430px;
    }

    .why-image img {
      height: 100%;
      object-fit: cover;
    }

    .why-content h2 {
      font-size: clamp(35px, 5vw, 56px);
      line-height: 1.05;
      color: var(--green-4);
      margin-bottom: 22px;
      letter-spacing: -.035em;
    }

    .why-content > p {
      color: var(--muted);
      font-size: 17px;
      margin-bottom: 35px;
    }

    .why-list {
      display: grid;
      gap: 22px;
    }

    .why-item {
      display: grid;
      grid-template-columns: 45px 1fr;
      gap: 15px;
      align-items: start;
    }

    .why-number {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--light);
      color: var(--green-3);
      font-weight: 800;
      font-size: 13px;
    }

    .why-item h3 {
      color: var(--green-4);
      margin-bottom: 4px;
      font-size: 18px;
    }

    .why-item p {
      color: var(--muted);
      font-size: 15px;
    }

    /* =========================
       CATALOG CTA
    ========================= */

    .catalog {
      padding: 0 0 110px;
    }

    .catalog-box {
      background: var(--green-4);
      border-radius: 25px;
      padding: 65px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 40px;
    }

    .catalog-box h2 {
      font-size: clamp(32px, 4vw, 52px);
      line-height: 1.05;
      margin-bottom: 14px;
    }

    .catalog-box p {
      max-width: 600px;
      color: rgba(255,255,255,.8);
    }

    .catalog-box .btn {
      flex-shrink: 0;
    }

    /* =========================
       REPRESENTATIVE
    ========================= */

    .representative
